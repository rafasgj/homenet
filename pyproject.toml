[project]
name = "homenet"
version = "0.1.0"
description = "Access an Omada ER605 router and list WAN networks"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.10"
dependencies = [
    "keyring",
    "requests",
    "urllib3",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
]

[project.scripts]
homenet = "homenet:main"

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
